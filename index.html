<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Management for Productivity</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom supplemental styles -->
  <link rel="stylesheet" href="style.css" />

  <!-- Tailwind custom config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'Segoe UI', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

  <!-- ===== TOP NAV BAR ===== -->
  <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-30">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <!-- Clock icon -->
        <svg class="w-6 h-6 text-brand-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span class="font-semibold text-white text-lg leading-tight">Time Management</span>
        <span class="hidden sm:inline text-brand-400 text-lg font-light">for Productivity</span>
      </div>
      <!-- Live clock -->
      <time id="live-clock" class="text-brand-400 font-mono text-sm tabular-nums" aria-live="polite" aria-label="Waktu sekarang">--:--:--</time>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="max-w-3xl mx-auto px-4 py-6 space-y-8">

    <!-- ===== SECTION: BUAT TASK BARU ===== -->
    <section aria-labelledby="create-task-heading">
      <h2 id="create-task-heading" class="text-xs font-semibold uppercase tracking-widest text-brand-400 mb-3">Buat Task Baru</h2>

      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 space-y-4">

        <!-- Nama task -->
        <div>
          <label for="task-name" class="block text-sm font-medium text-gray-300 mb-1">Nama Task <span class="text-red-400" aria-hidden="true">*</span></label>
          <input id="task-name" type="text" placeholder="Contoh: Kerjakan laporan akhir"
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent" />
        </div>

        <!-- Deadline grid -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">

          <!-- Target -->
          <div>
            <label for="deadline-target" class="block text-sm font-medium text-gray-300 mb-1">
              <span class="inline-block w-2 h-2 rounded-full bg-green-400 mr-1 align-middle" aria-hidden="true"></span>
              Target
            </label>
            <input id="deadline-target" type="datetime-local"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent" />
            <p class="text-xs text-gray-500 mt-1">Waktu ideal selesai</p>
          </div>

          <!-- Keringanan -->
          <div>
            <label for="deadline-grace" class="block text-sm font-medium text-gray-300 mb-1">
              <span class="inline-block w-2 h-2 rounded-full bg-yellow-400 mr-1 align-middle" aria-hidden="true"></span>
              Keringanan
            </label>
            <input id="deadline-grace" type="datetime-local"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent" />
            <p class="text-xs text-gray-500 mt-1">Toleransi tambahan</p>
          </div>

          <!-- Harus Kumpul -->
          <div>
            <label for="deadline-hard" class="block text-sm font-medium text-gray-300 mb-1">
              <span class="inline-block w-2 h-2 rounded-full bg-red-400 mr-1 align-middle" aria-hidden="true"></span>
              Harus Kumpul
            </label>
            <input id="deadline-hard" type="datetime-local"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent" />
            <p class="text-xs text-gray-500 mt-1">Batas maksimal</p>
          </div>

        </div>

        <!-- Tombol tambah task -->
        <button id="btn-add-task"
          class="w-full sm:w-auto bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white font-semibold text-sm px-6 py-2.5 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-brand-400 focus:ring-offset-2 focus:ring-offset-gray-900">
          + Tambah Task
        </button>

      </div>
    </section>

    <!-- ===== SECTION: DAFTAR TASK ===== -->
    <section aria-labelledby="task-list-heading">
      <h2 id="task-list-heading" class="text-xs font-semibold uppercase tracking-widest text-brand-400 mb-3">Daftar Task</h2>

      <!-- State kosong -->
      <div id="empty-state" class="text-center py-14 text-gray-600 hidden">
        <svg class="w-12 h-12 mx-auto mb-3 opacity-40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
        </svg>
        <p class="text-sm">Belum ada task. Buat task pertamamu di atas.</p>
      </div>

      <!-- Container daftar task -->
      <div id="task-list" class="space-y-4" role="list" aria-label="Daftar task"></div>

    </section>

  </main>

  <!-- ===== MODAL: TAMBAH MILESTONE ===== -->
  <div id="modal-milestone" class="modal-overlay hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop absolute inset-0 bg-black/70 backdrop-blur-sm" id="modal-backdrop"></div>
    <div class="modal-sheet relative bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md p-6 space-y-4 z-10">

      <h3 id="modal-title" class="text-base font-semibold text-white">Tambah Milestone</h3>

      <!-- Nama milestone -->
      <div>
        <label for="milestone-name" class="block text-sm font-medium text-gray-300 mb-1">Nama Milestone <span class="text-red-400" aria-hidden="true">*</span></label>
        <input id="milestone-name" type="text" placeholder="Contoh: Ngoding 30 menit"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500" />
      </div>

      <!-- Tombol modal -->
      <div class="flex gap-3 pt-1">
        <button id="btn-save-milestone"
          class="flex-1 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold py-2.5 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-brand-400">
          Simpan
        </button>
        <button id="btn-cancel-milestone"
          class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm font-semibold py-2.5 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-gray-500">
          Batal
        </button>
      </div>

    </div>
  </div>

  <!-- ===== MODAL: CATAT PENYELESAIAN MILESTONE ===== -->
  <div id="modal-complete" class="modal-overlay hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modal-complete-title">
    <div class="modal-backdrop absolute inset-0 bg-black/70 backdrop-blur-sm" id="modal-complete-backdrop"></div>
    <div class="modal-sheet relative bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md p-6 space-y-4 z-10">

      <h3 id="modal-complete-title" class="text-base font-semibold text-white">Catat Penyelesaian</h3>
      <p id="modal-complete-subtitle" class="text-sm text-gray-400"></p>

      <!-- Waktu mulai -->
      <div>
        <label for="complete-start" class="block text-sm font-medium text-gray-300 mb-1">Waktu Mulai <span class="text-red-400" aria-hidden="true">*</span></label>
        <input id="complete-start" type="datetime-local"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-brand-500" />
      </div>

      <!-- Waktu selesai -->
      <div>
        <label for="complete-end" class="block text-sm font-medium text-gray-300 mb-1">Waktu Selesai <span class="text-red-400" aria-hidden="true">*</span></label>
        <input id="complete-end" type="datetime-local"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-brand-500" />
      </div>

      <!-- Tombol modal -->
      <div class="flex gap-3 pt-1">
        <button id="btn-confirm-complete"
          class="flex-1 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold py-2.5 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-brand-400">
          Catat
        </button>
        <button id="btn-cancel-complete"
          class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm font-semibold py-2.5 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-gray-500">
          Batal
        </button>
      </div>

    </div>
  </div>

  <!-- Script utama -->
  <script src="script.js"></script>
</body>
</html>
